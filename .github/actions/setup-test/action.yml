name: 'Setup Test Environment'
description: 'Sets up the test environment'

inputs:
  installBWCLI:
    description: 'Install Bitwarden CLI'
    required: false
    default: 'false'
    type: boolean
  bwcliVersion:
    description: 'Version of Bitwarden CLI to install'
    required: false
    default: '2025.2.0'
    type: string
  installBWSCLI:
    description: 'Install Rust from mise.toml so mage can cargo-install debug bws 2.1.0 for Secrets Manager CLI tests'
    required: false
    default: 'false'
    type: boolean
  goVersion:
    description: 'Version of Go to install'
    required: false
    default: '1.27.3'
    type: string
  nodeVersion:
    description: 'Version of Node.js to install'
    required: false
    default: '23.x'
    type: string
  openTofuVersion:
    description: 'Version of OpenTofu to install'
    required: false
    default: 'v1.12.6'
    type: string
  deviceIdentifier:
    description: 'Device Identifier'
    required: false
    type: string

runs:
  using: "composite"
  steps:
      # Before setup-go so Go from actions/setup-go stays first on PATH.
      # install_args: rust skips the Go pin in mise.toml (setup-go owns Go + its cache).
      - name: Install Rust from mise.toml
        if: ${{ inputs.installBWSCLI }}
        uses: jdx/mise-action@v2
        with:
          cache: true
          install_args: rust

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=${{ inputs.goVersion }}"
          cache: true

      - name: Setup Node.js
        if: ${{ inputs.installBWCLI }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.nodeVersion }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.openTofuVersion }}

      - name: Install Bitwarden CLI
        if: ${{ inputs.installBWCLI }}
        shell: bash
        run: |
          npm install -g @bitwarden/cli@${{ inputs.bwcliVersion }}

      - name: Cache cargo registry and debug bws
        if: ${{ inputs.installBWSCLI }}
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug-bws-2.1.0
          cache-all-crates: "true"
          cache-bin: "false"
          cache-targets: "false"
          cache-on-failure: "true"
          cache-directories: tools/bws-debug

      - name: Install Mage
        shell: bash
        run: |
          go install github.com/magefile/mage@v1.15.0

      - name: Store Device Identifier
        if: ${{ inputs.deviceIdentifier }}
        shell: bash
        run: |
          mkdir -p ./internal/provider/.bitwarden
          echo -ne "${{ inputs.deviceIdentifier }}" > ./internal/provider/.bitwarden/device_identifier

